# In every message in this config:
# <c1> will be replaced with the c1: color in the theme: setting
# <c2> will be replaced with the c2: color in the theme: setting
# <success> will be replaced with the success: color in the theme: setting
# <error> will be replaced with the error: color in the theme: setting
# <warning> will be replaced with the warning: color in the theme: setting
# <prefix> will be replaced with the prefix: text

# This file strictly uses mini message only.

theme:
  c1: "#A745FF" # Color 1
  c2: "#cf97ff" # Color 2
  success: "#92ff60" # Success / green color
  error: "#ff6060" # Error / red color
  warning: "#ffd263" # Warning color

prefix: "<c1><bold>DirtyLeaderboards</bold> <dark_gray>┃</dark_gray> <white>" # Prefix
# I use ┃ instead of | because my texture pack changes | to look nearly identical to :
# It also looks a little bit slimmer, taller making it look nicer.

messages:
  no-permission: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>You don't have permission to do that."
  player-only: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>Only players can use this command."
  unknown-display: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>No display named <c2><display></c2> exists."
  no-displays: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>No displays are configured. Add one to config.yml first."
  specify-display: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>Specify a display: <c2><displays></c2>"

  reloaded: "<prefix><#74fd7b>✔ ꜱᴜᴄᴄᴇꜱꜱ: <success>Reloaded in <c2><time>ms</c2>."
  reload-failed: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>Reload failed, check the console for details."

  display-started: "<prefix><#74fd7b>✔ ꜱᴜᴄᴄᴇꜱꜱ: <success>Display <c2><display></c2> started."
  display-start-failed: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>Display <c2><display></c2> could not start, check the console."
  display-already-running: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>Display <c2><display></c2> is already running."
  display-stopped: "<prefix><#74fd7b>✔ ꜱᴜᴄᴄᴇꜱꜱ: <success>Display <c2><display></c2> stopped."
  display-not-running: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>Display <c2><display></c2> is not running."
  display-skipped: "<prefix><#74fd7b>✔ ꜱᴜᴄᴄᴇꜱꜱ: <success>Display <c2><display></c2> skipped to <c2><leaderboard></c2>."
  display-moved: "<prefix><#74fd7b>✔ ꜱᴜᴄᴄᴇꜱꜱ: <success>Display <c2><display></c2> moved to your location."
  display-created: "<prefix><#74fd7b>✔ ꜱᴜᴄᴄᴇꜱꜱ: <success>Display <c2><display></c2> created and spawned."
  display-setwall: "<prefix><#74fd7b>✔ ꜱᴜᴄᴄᴇꜱꜱ: <success>Display <c2><display></c2> relocated and resized."

  wand-given: "<prefix><#74fd7b>✔ ꜱᴜᴄᴄᴇꜱꜱ: <success>Given Leaderboard Wand! Left-click block for Pos1, Right-click for Pos2."
  wand-pos1-set: "<success>Pos1 set to (<c2><x></c2>, <c2><y></c2>, <c2><z></c2>)."
  wand-pos2-set: "<success>Pos2 set to (<c2><x></c2>, <c2><y></c2>, <c2><z></c2>)."
  wand-selection-complete: "<prefix><#74fd7b>✔ ꜱᴜᴄᴄᴇꜱꜱ: <success>Selection complete! Dimensions: <c2><w></c2>x<c2><h></c2> blocks. Run <c1>/dlb create <id></c1> or <c1>/dlb setwall <id></c1>"
  wand-no-selection: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>You must select Pos1 (Left-click) and Pos2 (Right-click) with the wand first!"
  wand-invalid-selection: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>Invalid 2D selection! Ensure both points are in the same world."
  create-usage: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>Usage: /dlb create <display_id> [board1,board2...]"
  setwall-usage: "<prefix><#fd7474>❌ ᴇʀʀᴏʀ: <error>Usage: /dlb setwall <display_id>"

  list-header: "<prefix><c2>Displays:"
  list-entry: " <dark_gray>•</dark_gray> <white><display></white> <dark_gray>-</dark_gray> <status> <dark_gray>(<gray>showing <leaderboard></gray>)</dark_gray>"
  list-entry-stopped: " <dark_gray>•</dark_gray> <white><display></white> <dark_gray>-</dark_gray> <status>"
  status-running: "<success>running"
  status-stopped: "<error>stopped"

  # Shown at the end of /dlb help when a newer version was found on Modrinth.
  # <current> is the installed version, <latest> the newest one, <url> the download page.
  # Update checker can be disabled in config.yml
  update-available: "<prefix><#ffd263>ᴜᴘᴅᴀᴛᴇ: <warning>Version <c2>v<latest></c2> is out! <dark_gray>(<gray>you are on v<current></gray>)</dark_gray>"
  update-link: " <dark_gray>•</dark_gray> <gray>Download <dark_gray>→</dark_gray> <c2><u><url></u></c2>"
  update-link-hover: "<c2>Click to open the Modrinth page"

  help:
    - "<prefix><c2>Commands: <dark_gray>(<gray>v<version></gray>)</dark_gray>"
    - " <c1>/dlb reload <dark_gray>-</dark_gray> <gray>Reload all configuration files"
    - " <c1>/dlb list <dark_gray>-</dark_gray> <gray>List displays and their status"
    - " <c1>/dlb start <display> <dark_gray>-</dark_gray> <gray>Start a display"
    - " <c1>/dlb stop <display> <dark_gray>-</dark_gray> <gray>Stop a display"
    - " <c1>/dlb skip <display> <dark_gray>-</dark_gray> <gray>Skip to the next leaderboard"
    - " <c1>/dlb move <display> <dark_gray>-</dark_gray> <gray>Move a display to where you stand"
    - " <c1>/dlb wand <dark_gray>-</dark_gray> <gray>Give the leaderboard placement wand"
    - " <c1>/dlb create <display> <dark_gray>-</dark_gray> <gray>Create a display from wand selection"
    - " <c1>/dlb setwall <display> <dark_gray>-</dark_gray> <gray>Resize display to wand selection"
